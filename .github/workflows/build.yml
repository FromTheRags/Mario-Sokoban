name: Build

# SDL 3 version (branch SDL_3). Every push builds Linux and Windows;
# a tag sdl3-v* (for example sdl3-v1.6) also publishes a GitHub release with the
# Linux archive, the Windows zip and the Windows installer.
on:
  push:
    branches: ['**']
    tags: ['sdl3-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # Latest Ubuntu runner: the archive needs the glibc of that release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest
          install-linux-dependencies: true
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{ steps.sdl.outputs.prefix }}
          cmake --build build --parallel
      - name: Bundle the SDL runtime
        run: |
          ./tools/package_sdl3_linux.sh build/package
          tar -C build -czf build/mario-sokoban-sdl3-linux.tar.gz package
      - uses: actions/upload-artifact@v7
        with:
          name: mario-sokoban-sdl3-linux
          path: build/mario-sokoban-sdl3-linux.tar.gz

  linux-legacy:
    # Built in an Ubuntu 20.04 container (glibc 2.31) on a current GitHub
    # runner: the archive runs on Ubuntu 20.04+, Debian 11+ and other
    # distributions with glibc 2.31 or newer.
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git g++ make ninja-build pkg-config python3-pip libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev
          # Ubuntu 20.04 ships CMake 3.16; the project needs 3.21+.
          python3 -m pip install --upgrade pip
          python3 -m pip install "cmake>=3.21,<4"
      - uses: actions/checkout@v7
      - name: Build SDL 3 from source (same version as the Windows SDK)
        run: |
          git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=/opt/sdl3
          cmake --build /tmp/SDL/build --parallel
          cmake --install /tmp/SDL/build
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/sdl3
          cmake --build build --parallel
      - name: Bundle the SDL runtime
        run: |
          ./tools/package_sdl3_linux.sh build/package
          tar -C build -czf build/mario-sokoban-sdl3-linux-legacy.tar.gz package
      - uses: actions/upload-artifact@v7
        with:
          name: mario-sokoban-sdl3-linux-legacy
          path: build/mario-sokoban-sdl3-linux-legacy.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Build (MinGW-w64, official SDL 3 SDK downloaded by CMake)
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME -replace '^sdl3-v', '' }
          else { $v = "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Zip the portable version
        shell: pwsh
        run: Compress-Archive -Path build\package\* -DestinationPath build\mario-sokoban-sdl3-windows.zip
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.value }}" installer\mario-sokoban.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: mario-sokoban-sdl3-windows
          path: |
            build/mario-sokoban-sdl3-windows.zip
            build/installer/*.exe

  release:
    needs: [linux, linux-legacy, windows]
    if: startsWith(github.ref, 'refs/tags/sdl3-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Mario Sokoban ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/**/*.tar.gz
            release/**/*.zip
            release/**/*.exe

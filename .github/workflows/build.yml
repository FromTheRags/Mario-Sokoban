name: Build

on:
  push:
    branches: [master, main, SDL_3]
    tags: ['v*']
  pull_request:
    branches: [master, main, SDL_3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sdl12:
    if: github.ref_name != 'SDL_3' && github.base_ref != 'SDL_3'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL 1.2 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ pkg-config libsdl1.2-dev libsdl-image1.2-dev libsdl-ttf2.0-dev
      - name: Configure and build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Bundle the executable and SDL runtime
        run: |
          cmake --build build --parallel
          ./tools/package_linux.sh build/package
          tar -C build -czf build/mario-sokoban-sdl12-linux.tar.gz package
      - uses: actions/upload-artifact@v4
        with:
          name: mario-sokoban-sdl12-linux
          path: build/mario-sokoban-sdl12-linux.tar.gz

  build-sdl3:
    if: github.ref_name == 'SDL_3' || github.base_ref == 'SDL_3'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3.4.20
          version-sdl-image: 3.4.8
          version-sdl-ttf: 3.2.2
          install-linux-dependencies: true
      - name: Configure and build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{ steps.sdl.outputs.prefix }}
      - name: Bundle SDL runtime
        run: |
          cmake --build build --parallel
          ./tools/package_sdl3_linux.sh build/package
          tar -C build -czf build/mario-sokoban-sdl3-linux.tar.gz package
      - uses: actions/upload-artifact@v4
        with:
          name: mario-sokoban-sdl3-linux
          path: build/mario-sokoban-sdl3-linux.tar.gz

  publish-release:
    needs: [build-sdl12, build-sdl3]
    if: always() && startsWith(github.ref, 'refs/tags/v') && (needs.build-sdl12.result == 'success' || needs.build-sdl3.result == 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.tar.gz

name: Build

# SDL 1.2 version (branch master). Every push builds Linux and Windows;
# a tag v* (for example v1.6) also publishes a GitHub release with the
# Linux archive, the Windows zip and the Windows installer.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install SDL 1.2 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libsdl1.2-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Bundle the SDL runtime
        run: |
          ./tools/package_linux.sh build/package
          tar -C build -czf build/mario-sokoban-linux.tar.gz package
      - uses: actions/upload-artifact@v7
        with:
          name: mario-sokoban-linux
          path: build/mario-sokoban-linux.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Build (MinGW-w64, vendored SDL 1.2)
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME -replace '^v', '' }
          else { $v = "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Zip the portable version
        shell: pwsh
        run: Compress-Archive -Path build\package\* -DestinationPath build\mario-sokoban-windows.zip
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.value }}" installer\mario-sokoban.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: mario-sokoban-windows
          path: |
            build/mario-sokoban-windows.zip
            build/installer/*.exe

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Mario Sokoban ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/**/*.tar.gz
            release/**/*.zip
            release/**/*.exe
